name: Release

# A new version is released by changing the number in VERSION and pushing to main.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} already exists: nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build on ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        run: python scripts/build_release.py deps --ui webui

      - name: Set version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./webui/package.json','utf8'));
            pkg.version = process.env.APP_VERSION;
            fs.writeFileSync('./webui/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: python scripts/build_release.py build --target windows --ui webui --skip-checks --skip-npm-install --version ${{ env.APP_VERSION }}

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: python scripts/build_release.py build --target macos --ui webui --skip-checks --skip-npm-install --version ${{ env.APP_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: jot-${{ runner.os }}
          path: |
            dist/jot-Setup-v*.exe
            dist/jot-Setup-v*.exe.sha256
            dist/jot-v*.dmg
            dist/jot-v*.dmg.sha256
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish release
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.exists != 'true' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'jot-Setup-v*' -o -name 'jot-v*.dmg*' \) -exec mv {} release/ \;
          ls -la release
          test -n "$(ls release/*.exe 2>/dev/null)" || { echo "Windows installer missing"; exit 1; }

      - name: Release notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          NOTES="docs/releases/v${VERSION}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" notes.md; else echo "jot v${VERSION}" > notes.md; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: jot v${{ needs.prepare.outputs.version }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          files: release/*
